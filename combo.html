<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSU Jazz Combo Recital 1/69 — Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f2ea; --card:#fffdf8; --ink:#1d2433; --muted:#6b6f7a; --line:#e4ddcf;
    --brass:#a8741f; --brass-soft:rgba(168,116,31,.16); --blue:#2f5d8a; --blue-soft:rgba(47,93,138,.10);
    --good:#2e7d5b; --warn:#b4542d; --shadow:0 1px 2px rgba(29,36,51,.06),0 4px 16px rgba(29,36,51,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#14171f; --card:#1c2029; --ink:#ece7dc; --muted:#9a9ca6; --line:#2d323d;
      --brass:#e0a748; --brass-soft:rgba(224,167,72,.20); --blue:#7fa8d1; --blue-soft:rgba(127,168,209,.12);
      --good:#5fbf92; --warn:#e58a62; --shadow:none; }
  }
  *{box-sizing:border-box}
  html{font-size:16px}
  @media (min-width:1200px){html{font-size:18px}}
  @media (min-width:1600px){html{font-size:20px}}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.55}
  .wrap{max-width:58rem;margin:0 auto;padding:40px 20px 80px}
  header{margin-bottom:28px}
  .eyebrow{font-size:0.8125rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:600}
  h1{font-family:Fraunces,serif;font-size:clamp(1.75rem,5vw,2.6rem);line-height:1.1;margin:6px 0 10px}
  .sub{color:var(--muted);margin:0;font-size:0.9375rem}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:22px 0 14px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;font-size:0.875rem;color:var(--muted)}
  .stats b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
  button.ghost{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:0.8125rem;padding:6px 12px;border-radius:999px;cursor:pointer}
  button.ghost:hover{border-color:var(--brass)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  .card.demo{border-style:dashed;border-color:var(--brass)}
  .card.empty{opacity:.62}
  .head{width:100%;display:grid;grid-template-columns:2.75rem 1fr auto 1.4rem;gap:14px;align-items:center;padding:14px 18px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .card.empty .head{cursor:default}
  .num{width:2.75rem;height:2.75rem;border-radius:10px;display:grid;place-items:center;font-family:Fraunces,serif;font-size:1.25rem;font-weight:700;background:var(--blue-soft);color:var(--blue)}
  .card.demo .num{background:var(--brass-soft);color:var(--brass);font-size:0.75rem;font-family:"IBM Plex Mono",monospace}
  .title{font-weight:600;font-size:1.0625rem}
  .meta{font-size:0.8125rem;color:var(--muted)}
  .tag{display:inline-block;font-size:0.6875rem;font-weight:600;letter-spacing:.06em;padding:1px 7px;border-radius:999px;background:var(--brass-soft);color:var(--brass);margin-left:6px;vertical-align:2px}
  .score{text-align:right}
  .score .big{font-family:"IBM Plex Mono",monospace;font-size:1.375rem;font-weight:600}
  .score .of{font-size:0.75rem;color:var(--muted)}
  .chev{transition:transform .2s;color:var(--muted)}
  .card.open .chev{transform:rotate(90deg)}
  .body{display:none;border-top:1px solid var(--line);padding:22px 18px 24px}
  .card.open .body{display:block}

  .grid{display:grid;grid-template-columns:minmax(0,26rem) 1fr;gap:26px;align-items:center}
  @media (max-width:680px){
    .grid{grid-template-columns:1fr}
    .wrap{padding-left:12px;padding-right:12px}
    .body{padding:16px 12px 20px}
    .radar{margin:0 -10px}
  }
  .radar svg{width:100%;height:auto;display:block;overflow:visible}
  .legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;font-size:0.75rem;color:var(--muted);margin-top:4px}
  .legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--brass);vertical-align:middle;margin-right:6px}
  .legend i.avg{border-top:2px dashed var(--blue)}
  .legend i.mid{border-top:2px dotted var(--muted);opacity:.7}

  table{width:100%;border-collapse:collapse;font-size:0.875rem}
  td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .an{font-weight:500}
  .an small{display:block;color:var(--muted);font-size:0.71875rem;font-weight:400;line-height:1.3}
  .bar{width:38%;padding:0 12px}
  .track{height:7px;border-radius:9px;background:var(--line);position:relative}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--brass)}
  .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--blue);border-radius:2px}
  .val{text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap}
  .val small{display:block;font-weight:500;color:var(--muted);font-size:0.6875rem}
  .hi{color:var(--good)} .lo{color:var(--warn)}

  h3{font-size:0.8125rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;font-weight:600}
  .comment{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--brass);padding:6px 10px 6px 14px;margin:0 0 12px;font:inherit;color:inherit;cursor:pointer;border-radius:0 8px 8px 0;transition:background .15s}
  .comment:hover,.comment:focus-visible{background:var(--brass-soft);outline:none}
  .comment .see{float:right;font-size:0.71875rem;color:var(--brass);font-weight:600}
  .modal{position:fixed;inset:0;background:rgba(15,18,26,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal.show{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:30rem;width:100%;max-height:90vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .sheet-head .title{font-size:1.125rem}
  .x{background:none;border:0;color:var(--muted);font-size:1.5rem;line-height:1;cursor:pointer;padding:0 4px}
  .dot{display:inline-block;width:1.4rem;height:1.4rem;border-radius:6px;font-family:"IBM Plex Mono",monospace;font-size:0.75rem;font-weight:600;line-height:1.4rem;text-align:center;background:var(--line);color:var(--muted);margin-left:3px}
  .dot.on{background:var(--brass);color:#fff}
  .diff{font-size:0.6875rem;font-weight:500;color:var(--muted);display:block}
  .help h4{font-size:0.875rem;margin:16px 0 6px}
  .help p,.help li{font-size:0.875rem;margin:0 0 6px}
  .help ul{padding-left:18px;margin:0}
  .sw{display:inline-block;width:22px;height:7px;border-radius:9px;background:var(--brass);vertical-align:middle}
  .tk{display:inline-block;width:2px;height:14px;background:var(--blue);vertical-align:middle;margin:0 4px}
  .dl{display:inline-block;width:20px;border-top:2px dashed var(--blue);vertical-align:middle}
  .sheet .quote{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:0.875rem}
  .comment .who{font-size:0.78125rem;color:var(--muted);margin-bottom:2px;font-weight:500}
  .cm{font-size:.95rem}
  .cm p{margin:0 0 6px}
  .cm p:last-child,.cm ul:last-child,.cm ol:last-child{margin-bottom:0}
  .cm ul,.cm ol{margin:0 0 8px;padding-left:1.3em}
  .cm li{margin:0 0 3px}
  .cm li ul{margin:3px 0 0}
  .cm .ttl{font-weight:600;margin:10px 0 3px}
  .cm .ttl:first-child{margin-top:0}
  .cm p.none{color:var(--muted);font-style:italic}
  footer{margin-top:36px;font-size:0.78125rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">RSU Jazz Program · Combo Recital 1/69</div>
    <h1>Faculty Feedback</h1>
    <p class="sub">คะแนนเฉลี่ยจากกรรมการที่ให้คะแนนแต่ละวง (เต็ม 7) และคอมเมนต์ — แตะที่วงเพื่อดูรายละเอียด</p>
  </header>

  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div><button class="ghost" id="helpBtn">วิธีใช้</button> <button class="ghost" id="expandAll">เปิดทั้งหมด</button> <button class="ghost" id="collapseAll">ปิดทั้งหมด</button></div>
  </div>

  <div id="list"></div>

</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<script>
/* ============================================================
   SETTINGS
   ============================================================ */
const SHOW_JUDGE_NAMES = false;   // false = "กรรมการ 1, 2, 3…" (anonymous)

/* Six aspects, in form order */
const ASPECTS = [
  { th:"จังหวะ",       en:"Time / Groove" },
  { th:"โซโล่",        en:"Improvisation" },
  { th:"ทักษะเครื่อง",  en:"Technique / Tone / Intonation" },
  { th:"ความเป็นวง",    en:"Ensemble Coordination" },
  { th:"บทเพลงและการนำเสนอ", en:"Composition / Arrangement / Reference" },
  { th:"ความไพเราะ",    en:"Musicality / Styles / Interpretation" },
];

/* Bands, as listed in the form */
const BANDS = [
  { id:"1", name:"อ.บาส" },
  { id:"2", name:"อ.ฟุง" },
  { id:"3", name:"อ.ม๋า 11 โมง" },
  { id:"4", name:"อ.เมส" },
  { id:"5", name:"อ.ม๋า 10 โมง" },
  { id:"6", name:"อ.ติว" },
  { id:"7", name:"อ.โจ๊ก เที่ยง" },
  { id:"8", name:"อ.Bartoz บ่าย 1" },
  { id:"9", name:"อ.กุ๊ก เที่ยง" },
  { id:"10", name:"อ.โจ๊ก 11 โมง" },
  { id:"11", name:"อ.กุ๊ก 10 โมง" },
  { id:"12", name:"อ.Bartoz บ่าย 2" },
  { id:"13", name:"อ.กุ๊ก 11 โมง" },
  { id:"14", name:"อ.ช้างต้น" },
];

/* ============================================================
   RESPONSES — one row per form submission (Combo recital, 25 Nov 2026)
   scores: [Time, Solo, Technique, Ensemble, Composition/Arrangement, Musicality]
   comment: cleaned for display ("- " bullets, "1. " numbered items, blank line = break)
   ============================================================ */
const RESPONSES = [
  {"band": "1", "judge": "อ.ฟุง", "scores": [4, 4, 4, 4, 4, 4], "comment": "อยากได้ยินภาษาแจ๊สมากกว่านี้พวก lick, vocabulary จาก recordings"},
  {"band": "1", "judge": "อ.กุ๊ก 👨‍🍳", "scores": [4, 4, 4, 4, 4, 4], "comment": "- เทียบเสียงให้ดี\n- เล่นเหมือนคนท่องหนังสือ เล่นให้เสียงมีความรู้สึกมากกว่านี้"},
  {"band": "1", "judge": "อ.ม๋า 🐶", "scores": [3, 3, 4, 3, 6, 3], "comment": "1. สายเพี้ยน\n2. แบ่งหน้าที่ให้ดี"},
  {"band": "1", "judge": "อ.ช้าง 🐘", "scores": [5, 5, 4, 6, 6, 4], "comment": "- ยังจัด balance ไม่ดี, ควรผลัดกัน Comp\n- ควรเพิ่มเรื่อง Dynamic การใช้ ดัง-เบาที่หลากหลาย"},
  {"band": "1", "judge": "อ.โจ๊ก 🥣", "scores": [3, 4, 5, 4, 7, 6], "comment": "Billie's Bounce\n- พาร์ทที่ทุกคนเล่น rhythm เดียวกัน เหมือนมีปัญหาเรื่อง tuning ไม่แน่ใจว่ามาจากการ tune สาย หรือการดันสาย\n- ควร balance dynamics พยายามทำให้โซโล่หรือเมโลดี้หลักดังกว่า comping\n\nMoanin'\n- nice arrangement\n- กลอง quarter note feel บน ride cymbals ต้อง drive กว่านี้ ตอนซ้อมพยายามฟังเสียงตัวเองให้เต็มกว่านี้ ตอนนี้เขียไปหน่อย\n- กลอง solo time feel แกว่งไปหน่อย แต่มี energy ดี\n- nice ending"},
  {"band": "1", "judge": "อ.บาส", "scores": [4, 2, 4, 6, 6, 5], "comment": "Tenor madness - นับเข้าดีๆครับ โน้ตแรกสำคัญมาก\nMoanin’ - โดยรวมดี ตอนจบไม่พร้อมกันนะครับ ตอนขึ้นกับตอนจบมันสำคัญมากๆ ของทุกๆเพลง\n\n- โดยรวม งานแจ๊สแรก ok ครับ เก็บชั่วโมงบินไปเรื่อยๆ จะค่อยๆดีขึ้นครับ"},
  {"band": "2", "judge": "อ.กุ๊ก 👨‍🍳", "scores": [4, 5, 4, 4, 5, 4], "comment": "- เรียนรู้การ comping แบบ Jazz\n- ซาวด์ตอนเมโลดี้ดีมาก"},
  {"band": "2", "judge": "อ.ช้าง 🐘", "scores": [4, 6, 5, 5, 5, 4], "comment": "- เพิ่มเรื่อง Dynamic ใช้ ดัง-เบาที่หลากหลาย\n- solo ให้ชัดเจนกว่านี้จะดี ไม่ต้องโน้ตเยอะ แต่ต้องชัด\n- เพิ่มเรื่อง Swing Articulation"},
  {"band": "2", "judge": "อ.ติว 👨‍🏫", "scores": [6, 5, 5, 5, 5, 5], "comment": "Bass แข็งแรงดีสามารถเป็นแกนให้วงได้\nวงขาดการสื่อสารระหว่างเล่น\nการ presentation วง Guitar ไม่ควรยืนบังมือกลอง โดยเฉพาะตอนกลอง solo"},
  {"band": "2", "judge": "อ.บาส", "scores": [6, 5, 6, 6, 7, 6], "comment": "ปรับไดนามิก การเปลี่ยนคน solo เพิ่มความน่าสนใจได้ครับ รวมๆดีมากครับ"},
  {"band": "2", "judge": "อ.Bartosz", "scores": [7, 6, 6, 7, 7, 6], "comment": "Very nice communication in the band. Good timing of the rhythm section. Could be more space in solos and more melodic thinking."},
  {"band": "2", "judge": "อ.ม๋า 🐶", "scores": [3, 3, 4, 4, 4, 4], "comment": "1. Gt. Comp เป็น pattern ปับนับห้องไปหน่อย\n2. มือกลอง เว้นว่างการลงสแนร์จังหวะที่ 1 บ้าง\n3. กีตาร์ดีดแล้วฟังไม่ชัด เสียงหายๆ\n4. มือกลอง solo ต้องมี time ด้วย\n5. เวลาเล่นทุกคนควรจะต้องจำ Arrangement ด้วย"},
  {"band": "2", "judge": "อ.โจ๊ก 🥣", "scores": [2, 5, 5, 4, 6, 5], "comment": "- เร่งจังหวะยก\n- ชอบที่เอา transcription มาใช้ เป็นวิธีการสร้างภาษาโซโล่ที่ดี\n- มือกลองหายใจลึก ๆ เหมือนตื่นเต้นแล้วเร่ง\n- bass มีพัฒนาการเพิ่มขึ้นมาก ดีใจครับ\n- กลองโซโล่ระวัง time ครับ เพื่อนจะหาไม่เจอนะ ซ้อมกับ metronome เยอะ ๆ"},
  {"band": "3", "judge": "อ.โจ๊ก 🥣", "scores": [4, 4, 5, 5, 6, 6], "comment": "Cold Duck Time\n- กรู๊ฟดี\n- โซโล่ diatonic เยอะไปหน่อย เพิ่มพวก chromaticisms, enclosures หรือโน้ตนอกสเกล\n\nPoinciana\n- time ดูรีบไปนิดนึง\n- color ของวงดี เลือกโทนเสียงน่าสนใจ\n- kicks ดี"},
  {"band": "3", "judge": "อ.บาส", "scores": [6, 5, 6, 6, 6, 6], "comment": "เพลงแรก - เพิ่มภาษา solo ให้แจ๊สขึ้นด้วยได้ด้วยแนวคิด solo ต่างๆ\nเพลงสอง - head ดี คน solo ควรทำความเข้าใจจังหวะในแนวนี้มากขึ้นครับ โดยรวม ok ครับ"},
  {"band": "3", "judge": "อ.เมส", "scores": [6, 4, 6, 6, 7, 6], "comment": "เพลงดีไซน์ออกมาน่าสนใจมากครับ เพลงแรกกลองจังหวะอาจจะยังไม่นิ่ง สามารถนิ่งและ setup มั่นใจได้กว่านี้ ส่วนเพลงสองผมคิดว่ากลองและเบสเป็น pattern ไปนิด อาจจะทำการตกแต่งให้ซาวด์ไม่น่าเบื่อครับ และเพลงยาวไปนิดครับ"},
  {"band": "3", "judge": "อ.ฟุง", "scores": [7, 4, 7, 7, 7, 7], "comment": "อยากให้ท่อนโซโล่เด่น ชัดๆกว่านี้หน่อย โดยรวมโอเคเลยครับ"},
  {"band": "3", "judge": "อ.ช้าง 🐘", "scores": [4, 5, 4, 4, 5, 5], "comment": "- จังหวะไม่นิ่ง โดยเฉพาะช่วง Gt สับคอร์ด\n- List เพลง มีอารมณ์หลากหลายดี\n- เพลง 2 ฟังดูยาวไปหน่อย สามารถทำให้กระชับกว่านี้ได้"},
  {"band": "3", "judge": "อ.ม๋า 🐶", "scores": [4, 4, 5, 5, 5, 5], "comment": ""},
  {"band": "3", "judge": "อ.Bartosz", "scores": [6, 7, 7, 7, 7, 7], "comment": "Interesting arrangements and choice of repertoire. Good stage energy."},
  {"band": "3", "judge": "อ.กุ๊ก 👨‍🍳", "scores": [4, 4, 4, 5, 5, 6], "comment": "1. Yeahhh ม่อน!!!\n- จังหวะไม่คงที่\n- แบ่งเสียงกีต้าร์ได้ดี\n\n2. กลองดี\n- ซาวด์รวมดีมาก\n- เพลงนิ่งไปหน่อย แต่ถ้าตั้งใจจะให้นิ่งก็อีกเรื่องนึงนะ แต่เราต้องทำให้มีมิติได้มากกว่านี้"},
  {"band": "4", "judge": "อ.Bartosz", "scores": [6, 6, 6, 6, 6, 7], "comment": "Very nice melody voicings. Definitely band feels funk and blues well."},
  {"band": "4", "judge": "อ.กุ๊ก 👨‍🍳", "scores": [4, 4, 4, 4, 4, 4], "comment": "ตอนเล่นจังหวะสวิง ทำให้รู้สึกสนุกเหมือนตอนเล่นที่จังหวะกรู๊ฟได้มั้ย"},
  {"band": "4", "judge": "อ.ช้าง 🐘", "scores": [5, 5, 5, 4, 6, 5], "comment": "- พยายามคุมจังหวะให้นิ่ง โดยเฉพาะช่วงที่มี kick ต่างๆ\n- แบ่งหน้าที่กันได้ดี"},

  {"band": "9", "judge": "อ.โจ๊ก 🥣", "scores": [5, 3, 5, 6, 7, 6], "comment": "Piece 1:\nharmonized melody แข็งแรงดีนะ\npiano solo ถ้ายังไม่มีไอเดียโซโล่ ลองใช้วิธีแต่งมาก่อน หรือให้เพื่อนกับอาจารย์ช่วยดูโซโล่ที่เราแต่งมา หรือลองหา reference แล้วไปแกะมา อาจจะหาเพลงอื่นที่คอร์ดเป็น minor blues เหมือนกัน แล้วฟังว่าเค้าโซโล่อะไรยังไงบ้าง\n\nPiece 2:\nmelody แข็งแรงมาก energy มาเต็ม ชอบมาก\ntrombone solo อยากให้แกะหรือแต่ง motif หรือประโยคสั้น ๆ เตรียมไว้ก่อน ถ้าคิดหน้างานไม่ค่อยทัน ก็ต้องแต่งเตรียมไว้ก่อนนะ\n\nPiece 3:\nเพลงสุดท้าย comment เหมือนสองเพลงแรก\nguitar solo มี landing note บางตัวหลุดคอร์ด โดยรวม ติด rock เยอะไปหน่อย"},

  {"band": "10", "judge": "อ.เมส", "scores": [7, 6, 7, 6, 7, 5], "comment": "The Others - ทุกคนทำการบ้านมาดี รุจดูไม่ค่อยมั่นใจ นับตลอด ท่อน melody แอบอยากได้ยิน guitar 3 ตัวประสานกัน\n\nMaiden Voyage - ช่วงที่กีต้าร์ทั้งสามคนเริ่มเล่นพร้อมกัน และโฟล์คโซโล่ กีต้าร์ไม่ค่อยออก อาจจะต้องเตรียมเสียงสำหรับโซโล่ให้เด่นกว่านี้\n\nทั้งสองเพลงมีการทำ sound design กล้าเล่นดีมาก\n\nแต่คิดว่าสองเพลงคาแร็คเตอร์และซาวด์ของกีต้าร์ที่ใช้คล้ายกันเกินไปนิดนึงครับ"},

/* ============================================================
   COMPUTE
   ============================================================ */
const mean = a => a.reduce((s,x)=>s+x,0)/a.length;
const fmt = x => x==null ? "–" : x.toFixed(1);

function summarize(rows){
  if(!rows.length) return null;
  const per = ASPECTS.map((_,i)=>rows.map(r=>Number(r.scores[i])).filter(v=>!isNaN(v)));
  const avg = per.map(v=>v.length?mean(v):null);
  return { n:rows.length, avg, min:per.map(v=>Math.min(...v)), max:per.map(v=>Math.max(...v)), overall:mean(avg.filter(v=>v!=null)) };
}

const real = BANDS.map(b=>({ band:b, rows:RESPONSES.filter(r=>String(r.band).trim().split(/\s|-/)[0]===b.id) }))
  .map(x=>({ ...x, sum:summarize(x.rows) }));
const scored = real.filter(x=>x.sum);
const programAvg = scored.length>=2 ? ASPECTS.map((_,i)=>mean(scored.map(x=>x.sum.avg[i]))) : null;

/* ============================================================
   RADAR (inline SVG)
   ============================================================ */
/* Radar position order, clockwise from top (indices into ASPECTS).
   Opposite pairs: โซโล่–ความเป็นวง · ทักษะเครื่อง–จังหวะ · ความไพเราะ–บทเพลงและการนำเสนอ
   Top: ความไพเราะ · right side = individual (โซโล่, ทักษะเครื่อง) · bottom: บทเพลงและการนำเสนอ · left side = band (ความเป็นวง, จังหวะ) */
const RADAR_ORDER = [5,1,2,4,3,0];

/* Order of the score bars and judge popup (indices into ASPECTS) */
const BAR_ORDER = [3,0,1,2,4,5];  // ความเป็นวง, จังหวะ, โซโล่, ทักษะเครื่อง, บทเพลงและการนำเสนอ, ความไพเราะ
const grouped = (row) => BAR_ORDER.map(row).join("");

function radar(avg0, overlay0){
  const AX=RADAR_ORDER.map(k=>ASPECTS[k]), avg=RADAR_ORDER.map(k=>avg0[k]), overlay=overlay0&&RADAR_ORDER.map(k=>overlay0[k]);
  const W=452,H=386,cx=226,cy=188,R=132,MAX=7,N=ASPECTS.length;
  const ang=i=>(-90+i*360/N)*Math.PI/180;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/MAX, cy+Math.sin(ang(i))*R*v/MAX];
  const poly=vals=>vals.map((v,i)=>pt(i,v??0).map(n=>n.toFixed(1)).join(",")).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar chart of aspect averages">`;
  for(let k=1;k<=MAX;k++){
    const style = k===MAX ? 'stroke="var(--muted)" stroke-opacity=".45" stroke-width="1.2"'
                :           'stroke="var(--line)" stroke-width=".8"';
    s+=`<polygon points="${poly(Array(N).fill(k))}" fill="none" ${style}/>`;
  }
  for(let i=0;i<N;i++){const [x,y]=pt(i,MAX);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width=".8"/>`;}
  if(overlay) s+=`<polygon points="${poly(overlay)}" fill="none" stroke="var(--blue)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  s+=`<polygon points="${poly(avg)}" fill="var(--brass-soft)" stroke="var(--brass)" stroke-width="2.4" stroke-linejoin="round"/>`;
  avg.forEach((v,i)=>{ if(v==null) return; const [x,y]=pt(i,v); s+=`<circle cx="${x}" cy="${y}" r="4.2" fill="var(--brass)"/>`; });
  AX.forEach((a,i)=>{
    const [x,y]=pt(i,MAX+1.0); const c=Math.cos(ang(i));
    const anchor=Math.abs(c)<.2?"middle":c>0?"start":"end";
    const dy = i===0?-10 : (Math.abs(c)<.2?12:0);
    const lines=a.radar||[a.th];
    const y0 = y+dy-(lines.length-1)*10;
    lines.forEach((t,j)=>{ s+=`<text x="${x}" y="${y0+j*20}" text-anchor="${anchor}" font-size="15.5" font-weight="600" fill="var(--ink)">${t}</text>`; });
    s+=`<text x="${x}" y="${y0+(lines.length-1)*20+18}" text-anchor="${anchor}" font-size="14" font-family="IBM Plex Mono, monospace" font-weight="600" fill="var(--brass)">${fmt(avg[i])}</text>`;
  });
  return s+`</svg>`;
}

const esc = t => String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Turn a cleaned comment into tidy HTML: paragraphs, bullets, numbered items, song titles */
function fmtComment(text){
  const L=String(text||"").split("\n"); let h="", list=null, inLi=false, sub=false;
  const closeSub=()=>{ if(sub){h+="</ul>";sub=false;} };
  const close=()=>{ closeSub(); if(inLi){h+="</li>";inLi=false;} if(list){h+=`</${list}>`;list=null;} };
  L.forEach((raw,k)=>{
    const line=raw.trim(), next=(L[k+1]||"").trim();
    if(!line){ close(); return; }
    let m;
    if(m=line.match(/^- (.*)$/)){
      if(list==="ol"&&inLi){ if(!sub){h+="<ul>";sub=true;} h+=`<li>${esc(m[1])}</li>`; return; }
      if(list!=="ul"){ close(); h+="<ul>"; list="ul"; }
      h+=`<li>${esc(m[1])}</li>`; return;
    }
    if(m=line.match(/^(\d+)\. (.*)$/)){
      if(list!=="ol"){ close(); h+="<ol>"; list="ol"; } else { closeSub(); if(inLi) h+="</li>"; }
      h+=`<li value="${m[1]}">${esc(m[2])}`; inLi=true; return;
    }
    close();
    const nextIsList=/^(- |\d+\. )/.test(next);
    if(/:$/.test(line) || (line.length<=24 && next && (nextIsList || /^(เพลง|piece|solo)/i.test(line)))){
      h+=`<div class="ttl">${esc(line.replace(/:$/,""))}</div>`; return;
    }
    if(m=line.match(/^(.{2,22}?)\s*[-–:]\s+(.+)$/)){ h+=`<p><b>${esc(m[1])}</b> — ${esc(m[2])}</p>`; return; }
    h+=`<p>${esc(line)}</p>`;
  });
  close(); return h;
}

const judgeLabel=(r,i)=>SHOW_JUDGE_NAMES?esc(r.judge):"กรรมการ "+(i+1);

function openJudge(band, rows, i, sum, isDemo){
  const r=rows[i];
  const lines=grouped(k=>{
    const a=ASPECTS[k], v=Number(r.scores[k]), d=v-sum.avg[k];
    const diff = rows.length>1 ? `<span class="diff">${d>0?"+":""}${d.toFixed(1)} จากค่าเฉลี่ยวง</span>` : "";
    const dots=[1,2,3,4,5,6,7].map(n=>`<span class="dot${n===v?" on":""}">${n}</span>`).join("");
    return `<tr><td class="an">${a.th}<small>${a.en}</small>${diff}</td><td class="val" style="padding-left:10px">${dots}</td></tr>`;
  }, 2);
  const total=mean(r.scores.map(Number));
  document.getElementById("sheet").innerHTML=`
    <div class="sheet-head"><div><div class="title">${judgeLabel(r,i)}</div>
      <div class="meta">${isDemo?esc(band.name):"วง "+band.id+" · "+esc(band.name)} · เฉลี่ย <b>${fmt(total)}</b>/7</div></div>
      <button class="x" aria-label="ปิด" id="closeModal">×</button></div>
    <table>${lines}</table>
    ${String(r.comment||"").trim()?`<div class="quote cm">${fmtComment(r.comment)}</div>`:""}`;
  const m=document.getElementById("modal"); m.classList.add("show");
  document.getElementById("closeModal").onclick=closeJudge; document.getElementById("closeModal").focus();
}

function card(band, rows, sum, overlay, isDemo){
  const el=document.createElement("section");
  el.className="card"+(isDemo?" demo":"")+(sum?"":" empty");
  const label = isDemo ? "DEMO" : band.id;
  const meta = sum ? `${sum.n} ${sum.n===1?"judge":"judges"}` : "ยังไม่มีคะแนน · awaiting scores";
  el.innerHTML = `
    <button class="head" ${sum?"":"disabled"} aria-expanded="false">
      <div class="num">${label}</div>
      <div><div class="title">${isDemo?esc(band.name):"วง "+band.id+" · "+esc(band.name)}${isDemo?'<span class="tag">ตัวอย่าง</span>':""}</div>
        <div class="meta">${meta}</div></div>
      <div class="score">${sum?`<span class="big">${fmt(sum.overall)}</span><span class="of"> /7</span>`:""}</div>
      <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${sum?'<path d="M5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>':""}</svg>
    </button>
    <div class="body"></div>`;
  if(!sum) return el;

  const best=Math.max(...sum.avg), worst=Math.min(...sum.avg);
  const tableRows = grouped(i=>{
    const a=ASPECTS[i], v=sum.avg[i], cls = v===best&&best!==worst?"hi":v===worst&&best!==worst?"lo":"";
    const mark = overlay?`<div class="mark" style="left:calc(${overlay[i]/7*100}% - 1px)" title="Program avg ${fmt(overlay[i])}"></div>`:"";
    return `<tr><td class="an">${a.th}<small>${a.en}</small></td>
      <td class="bar"><div class="track"><div class="fill" style="width:${v/7*100}%"></div>${mark}</div></td>
      <td class="val ${cls}">${fmt(v)}<small>${sum.n>1?`${sum.min[i]}–${sum.max[i]}`:""}</small></td></tr>`;
  }, 3);

  const comments = rows.map((r,i)=>`
    <button class="comment" data-i="${i}"><div class="who">${judgeLabel(r,i)}<span class="see">ดูใบลงคะแนน →</span></div>
      <div class="cm">${String(r.comment||"").trim()?fmtComment(r.comment):'<p class="none">ไม่มีคอมเมนต์</p>'}</div></button>`).join("");

  el.querySelector(".body").innerHTML = `
    <div class="grid">
      <div class="radar">${radar(sum.avg, overlay)}
        <div class="legend"><span><i></i>วงนี้</span>${overlay?'<span><i class="avg"></i>เฉลี่ยทุกวง</span>':""}</div></div>
      <table>${tableRows}</table>
    </div>
    <h3>คอมเมนต์จากกรรมการ · Comments</h3>
    ${comments}`;

  el.querySelectorAll(".comment").forEach(b=>b.addEventListener("click",()=>openJudge(band,rows,+b.dataset.i,sum,isDemo)));
  const head=el.querySelector(".head");
  head.addEventListener("click",()=>{ const o=el.classList.toggle("open"); head.setAttribute("aria-expanded",o); });
  return el;
}

const list=document.getElementById("list");
real.forEach(x=>list.appendChild(card(x.band, x.rows, x.sum, programAvg, false)));

document.getElementById("stats").innerHTML =
  `<span><b>${scored.length}</b>/${BANDS.length} วงมีคะแนน</span><span><b>${RESPONSES.length}</b> ใบประเมิน</span>`+
  (scored.length?`<span>เฉลี่ยรวม <b>${fmt(mean(scored.map(x=>x.sum.overall)))}</b></span>`:"");

const setAll=open=>document.querySelectorAll(".card:not(.empty)").forEach(c=>{c.classList.toggle("open",open);c.querySelector(".head").setAttribute("aria-expanded",open);});
document.getElementById("helpBtn").onclick=openHelp;
document.getElementById("expandAll").onclick=()=>setAll(true);
document.getElementById("collapseAll").onclick=()=>setAll(false);

document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeJudge(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeJudge(); });

/* Open the first card that has data */
const first=document.querySelector(".card:not(.empty)"); if(first){first.classList.add("open");first.querySelector(".head").setAttribute("aria-expanded",true);}
</script>
</body>
</html>
