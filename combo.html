<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSU Jazz Combo Recital 1/69 — Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f2ea; --card:#fffdf8; --ink:#1d2433; --muted:#6b6f7a; --line:#e4ddcf;
    --brass:#a8741f; --brass-soft:rgba(168,116,31,.16); --blue:#2f5d8a; --blue-soft:rgba(47,93,138,.10);
    --good:#2e7d5b; --warn:#b4542d; --shadow:0 1px 2px rgba(29,36,51,.06),0 4px 16px rgba(29,36,51,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#14171f; --card:#1c2029; --ink:#ece7dc; --muted:#9a9ca6; --line:#2d323d;
      --brass:#e0a748; --brass-soft:rgba(224,167,72,.20); --blue:#7fa8d1; --blue-soft:rgba(127,168,209,.12);
      --good:#5fbf92; --warn:#e58a62; --shadow:none; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.55}
  .wrap{max-width:880px;margin:0 auto;padding:40px 20px 80px}
  header{margin-bottom:28px}
  .eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:600}
  h1{font-family:Fraunces,serif;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:6px 0 10px}
  .sub{color:var(--muted);margin:0;font-size:15px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:22px 0 14px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
  .stats b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
  button.ghost{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
  button.ghost:hover{border-color:var(--brass)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  .card.demo{border-style:dashed;border-color:var(--brass)}
  .card.empty{opacity:.62}
  .head{width:100%;display:grid;grid-template-columns:44px 1fr auto 22px;gap:14px;align-items:center;padding:14px 18px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
  .card.empty .head{cursor:default}
  .num{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:Fraunces,serif;font-size:20px;font-weight:700;background:var(--blue-soft);color:var(--blue)}
  .card.demo .num{background:var(--brass-soft);color:var(--brass);font-size:12px;font-family:"IBM Plex Mono",monospace}
  .title{font-weight:600;font-size:17px}
  .meta{font-size:13px;color:var(--muted)}
  .tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;padding:1px 7px;border-radius:999px;background:var(--brass-soft);color:var(--brass);margin-left:6px;vertical-align:2px}
  .score{text-align:right}
  .score .big{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600}
  .score .of{font-size:12px;color:var(--muted)}
  .chev{transition:transform .2s;color:var(--muted)}
  .card.open .chev{transform:rotate(90deg)}
  .body{display:none;border-top:1px solid var(--line);padding:22px 18px 24px}
  .card.open .body{display:block}

  .grid{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:26px;align-items:center}
  @media (max-width:680px){.grid{grid-template-columns:1fr}}
  .radar svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);margin-top:4px}
  .legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--brass);vertical-align:middle;margin-right:6px}
  .legend i.avg{border-top:2px dashed var(--blue)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .an{font-weight:500}
  .an small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;line-height:1.3}
  .bar{width:38%;padding:0 12px}
  .track{height:7px;border-radius:9px;background:var(--line);position:relative}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--brass)}
  .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--blue);border-radius:2px}
  .val{text-align:right;font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap}
  .val small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .hi{color:var(--good)} .lo{color:var(--warn)}

  h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;font-weight:600}
  .comment{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--brass);padding:6px 10px 6px 14px;margin:0 0 12px;font:inherit;color:inherit;cursor:pointer;border-radius:0 8px 8px 0;transition:background .15s}
  .comment:hover,.comment:focus-visible{background:var(--brass-soft);outline:none}
  .comment .see{float:right;font-size:11.5px;color:var(--brass);font-weight:600}
  .modal{position:fixed;inset:0;background:rgba(15,18,26,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal.show{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:22px 22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .sheet-head .title{font-size:18px}
  .x{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
  .dot{display:inline-block;width:22px;height:22px;border-radius:6px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;line-height:22px;text-align:center;background:var(--line);color:var(--muted);margin-left:3px}
  .dot.on{background:var(--brass);color:#fff}
  .diff{font-size:11px;font-weight:500;color:var(--muted);display:block}
  .help h4{font-size:14px;margin:16px 0 6px}
  .help p,.help li{font-size:14px;margin:0 0 6px}
  .help ul{padding-left:18px;margin:0}
  .sw{display:inline-block;width:22px;height:7px;border-radius:9px;background:var(--brass);vertical-align:middle}
  .tk{display:inline-block;width:2px;height:14px;background:var(--blue);vertical-align:middle;margin:0 4px}
  .dl{display:inline-block;width:20px;border-top:2px dashed var(--blue);vertical-align:middle}
  .sheet .quote{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);white-space:pre-wrap;font-size:14px}
  .comment .who{font-size:12.5px;color:var(--muted);margin-bottom:2px;font-weight:500}
  .comment p{margin:0;white-space:pre-wrap}
  footer{margin-top:36px;font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">RSU Jazz Program · Combo Recital 1/69</div>
    <h1>Faculty Feedback by Band</h1>
    <p class="sub">คะแนนเฉลี่ยจากกรรมการที่ให้คะแนนแต่ละวง (เต็ม 7) และคอมเมนต์ — แตะที่วงเพื่อดูรายละเอียด</p>
  </header>

  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div><button class="ghost" id="helpBtn">วิธีใช้</button> <button class="ghost" id="expandAll">เปิดทั้งหมด</button> <button class="ghost" id="collapseAll">ปิดทั้งหมด</button></div>
  </div>

  <div id="list"></div>

  <footer>Scale: 1 อ่อน · 4 กลาง · 7 เยี่ยม &nbsp;·&nbsp; Averages use only the judges who scored that band.</footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<script>
/* ============================================================
   SETTINGS
   ============================================================ */
const SHOW_JUDGE_NAMES = false;   // false = "กรรมการ 1, 2, 3…" (anonymous)
const TOTAL_JUDGES = 5;           // used for the "4/5 judges" count

/* Six aspects, in form order */
const ASPECTS = [
  { th:"จังหวะ",       en:"Time / Groove" },
  { th:"โซโล่",        en:"Improvisation" },
  { th:"ทักษะเครื่อง",  en:"Technique / Tone / Intonation" },
  { th:"ความเป็นวง",    en:"Ensemble Coordination" },
  { th:"การเรียบเรียง",  en:"Arrangement / Interpretation" },
  { th:"ความไพเราะ",    en:"Musicality / Style / Articulations / Dynamics" },
];

/* Bands, as listed in the form */
const BANDS = [
  { id:"1",  name:"อ.บาส" },
  { id:"2",  name:"อ.ฟุง" },
  { id:"3",  name:"อ.ม๋า 11 โมง" },
  { id:"4",  name:"อ.เมส" },
  { id:"5",  name:"อ.ม๋า 10 โมง" },
  { id:"6",  name:"อ.ติว" },
  { id:"7",  name:"อ.โจ๊ก เที่ยง" },
  { id:"8",  name:"อ.Bartoz บ่าย 1" },
  { id:"9",  name:"อ.กุ๊ก เที่ยง" },
  { id:"10", name:"อ.โจ๊ก 11 โมง" },
  { id:"11", name:"อ.กุ๊ก 10 โมง" },
  { id:"12", name:"อ.Bartoz บ่าย 2" },
  { id:"13", name:"อ.ช้างต้น" },
];

/* ============================================================
   RESPONSES — one row per form submission
   band: band number as text ("1"…"13") · judge: as selected in form
   scores: [Time, Solo, Technique, Ensemble, Arrangement, Musicality]
   ============================================================ */
const RESPONSES = [
  // { band:"1", judge:"อ.ช้าง 🐘", scores:[6,5,5,6,4,5], comment:"..." },
];

/* Demo band — shown at the top until real data replaces it */
const SHOW_DEMO = true;
const DEMO = {
  band:{ id:"DEMO", name:"Demo Combo ตัวอย่าง" },
  responses:[
    { judge:"อ.ช้าง 🐘", scores:[6,5,5,6,4,5], comment:"Groove แน่นมากในเพลงแรก โดยเฉพาะ bass กับกลองล็อกกันดี แต่ช่วง swing tempo เร็วเริ่มเร่ง ระวังตอนเข้า bridge" },
    { judge:"อ.กุ๊ก 👨‍🍳", scores:[5,6,5,5,4,6], comment:"โซโล่แซกโซโฟนเล่าเรื่องได้ดี มี motif ชัด อยากให้ทุกคนฟัง dynamics กันมากกว่านี้ตอน comping" },
    { judge:"อ.ติว 👨‍🏫", scores:[6,4,4,5,3,5], comment:"Arrangement ยังค่อนข้างตรงตัว ลองเพิ่ม intro/outro หรือ send-off ที่เป็นของวงเอง\nIntonation ของ horn section ช่วง head out ยังไม่ลงตัว" },
    { judge:"อ.โจ๊ก 🥣", scores:[7,5,6,6,5,6], comment:"Overall a confident set. Nice interplay between piano and guitar — stay out of each other's register when comping." },
  ],
  programAvg:[5.2,4.6,4.8,5.0,4.3,5.0], // dashed line in demo only
};

/* ============================================================
   COMPUTE
   ============================================================ */
const mean = a => a.reduce((s,x)=>s+x,0)/a.length;
const fmt = x => x==null ? "–" : x.toFixed(1);

function summarize(rows){
  if(!rows.length) return null;
  const per = ASPECTS.map((_,i)=>rows.map(r=>Number(r.scores[i])).filter(v=>!isNaN(v)));
  const avg = per.map(v=>v.length?mean(v):null);
  return { n:rows.length, avg, min:per.map(v=>Math.min(...v)), max:per.map(v=>Math.max(...v)), overall:mean(avg.filter(v=>v!=null)) };
}

const real = BANDS.map(b=>({ band:b, rows:RESPONSES.filter(r=>String(r.band).trim().split(/\s|-/)[0]===b.id) }))
  .map(x=>({ ...x, sum:summarize(x.rows) }));
const scored = real.filter(x=>x.sum);
const programAvg = scored.length>=2 ? ASPECTS.map((_,i)=>mean(scored.map(x=>x.sum.avg[i]))) : null;

/* ============================================================
   RADAR (inline SVG)
   ============================================================ */
function radar(avg, overlay){
  const W=440,H=330,cx=220,cy=165,R=108,MAX=7,N=ASPECTS.length;
  const ang=i=>(-90+i*360/N)*Math.PI/180;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/MAX, cy+Math.sin(ang(i))*R*v/MAX];
  const poly=vals=>vals.map((v,i)=>pt(i,v??0).map(n=>n.toFixed(1)).join(",")).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar chart of aspect averages">`;
  for(let k=1;k<=MAX;k++){
    const strong=k===4||k===7;
    s+=`<polygon points="${poly(Array(N).fill(k))}" fill="none" stroke="var(--line)" stroke-width="${strong?1.4:.8}"/>`;
  }
  for(let i=0;i<N;i++){const [x,y]=pt(i,MAX);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width=".8"/>`;}
  [4,7].forEach(k=>{s+=`<text x="${cx+4}" y="${cy-R*k/MAX+11}" font-size="9.5" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${k}</text>`;});
  if(overlay) s+=`<polygon points="${poly(overlay)}" fill="none" stroke="var(--blue)" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  s+=`<polygon points="${poly(avg)}" fill="var(--brass-soft)" stroke="var(--brass)" stroke-width="2.4" stroke-linejoin="round"/>`;
  avg.forEach((v,i)=>{ if(v==null) return; const [x,y]=pt(i,v); s+=`<circle cx="${x}" cy="${y}" r="3.6" fill="var(--brass)"/>`; });
  ASPECTS.forEach((a,i)=>{
    const [x,y]=pt(i,MAX+1.25); const c=Math.cos(ang(i));
    const anchor=Math.abs(c)<.2?"middle":c>0?"start":"end";
    const dy = i===0?-6 : (Math.abs(c)<.2?12:0);
    s+=`<text x="${x}" y="${y+dy}" text-anchor="${anchor}" font-size="13" font-weight="600" fill="var(--ink)">${a.th}</text>`;
    s+=`<text x="${x}" y="${y+dy+15}" text-anchor="${anchor}" font-size="11.5" font-family="IBM Plex Mono, monospace" font-weight="600" fill="var(--brass)">${fmt(avg[i])}</text>`;
  });
  return s+`</svg>`;
}

/* ============================================================
   RENDER
   ============================================================ */
const esc = t => String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const judgeLabel=(r,i)=>SHOW_JUDGE_NAMES?esc(r.judge):"กรรมการ "+(i+1);

function openJudge(band, rows, i, sum, isDemo){
  const r=rows[i];
  const lines=ASPECTS.map((a,k)=>{
    const v=Number(r.scores[k]), d=v-sum.avg[k];
    const diff = rows.length>1 ? `<span class="diff">${d>0?"+":""}${d.toFixed(1)} จากค่าเฉลี่ยวง</span>` : "";
    const dots=[1,2,3,4,5,6,7].map(n=>`<span class="dot${n===v?" on":""}">${n}</span>`).join("");
    return `<tr><td class="an">${a.th}<small>${a.en}</small>${diff}</td><td class="val" style="padding-left:10px">${dots}</td></tr>`;
  }).join("");
  const total=mean(r.scores.map(Number));
  document.getElementById("sheet").innerHTML=`
    <div class="sheet-head"><div><div class="title">${judgeLabel(r,i)}</div>
      <div class="meta">${isDemo?esc(band.name):"วง "+band.id+" · "+esc(band.name)} · เฉลี่ย <b>${fmt(total)}</b>/7</div></div>
      <button class="x" aria-label="ปิด" id="closeModal">×</button></div>
    <table>${lines}</table>
    ${String(r.comment||"").trim()?`<p class="quote">${esc(r.comment.trim())}</p>`:""}`;
  const m=document.getElementById("modal"); m.classList.add("show");
  document.getElementById("closeModal").onclick=closeJudge; document.getElementById("closeModal").focus();
}
function openHelp(){
  document.getElementById("sheet").innerHTML=`
    <div class="sheet-head"><div class="title">วิธีใช้</div><button class="x" aria-label="ปิด" id="closeModal">×</button></div>
    <div class="help">
      <h4>1 · เปิดดูแต่ละวง</h4>
      <p>แตะที่การ์ดวงเพื่อเปิด/ปิด ตัวเลขมุมขวาคือคะแนนเฉลี่ยรวมของวง (เต็ม 7) และใต้ชื่อวงบอกจำนวนกรรมการที่ให้คะแนนวงนั้น</p>
      <h4>2 · กราฟเรดาร์</h4>
      <p>แสดงคะแนนเฉลี่ย 6 ด้าน ยิ่งพื้นที่กว้างออกไปทางขอบ ยิ่งคะแนนสูง เส้นประสีฟ้า <span class="dl"></span> คือค่าเฉลี่ยของทุกวง</p>
      <h4>3 · แถบคะแนน</h4>
      <ul>
        <li><span class="sw"></span> แถบสีเหลือง = คะแนนเฉลี่ยของวงนี้</li>
        <li><span class="tk"></span> ขีดสีฟ้า = ค่าเฉลี่ยของทุกวง ถ้าแถบเลยขีดคือสูงกว่าค่าเฉลี่ย</li>
        <li>ตัวเลขเล็ก เช่น <b>5–7</b> = คะแนนต่ำสุด–สูงสุดที่กรรมการแต่ละท่านให้ ช่วงกว้างแปลว่ากรรมการเห็นต่างกัน ช่วงแคบแปลว่ากรรมการเห็นตรงกัน</li>
        <li>ด้านที่เป็น<span class="hi"> สีเขียว</span> คือจุดแข็งที่สุด<span class="lo"> สีส้ม</span> คือด้านที่ควรพัฒนาที่สุด</li>
      </ul>
      <h4>4 · คอมเมนต์</h4>
      <p>แตะที่คอมเมนต์เพื่อดูคะแนนรายด้านของกรรมการท่านนั้น และดูว่าสูงหรือต่ำกว่าค่าเฉลี่ยของวงเท่าใด</p>
      <h4>หมายเหตุ</h4>
      <p>คะแนนเฉลี่ยคิดจากกรรมการที่ให้คะแนนวงนั้นเท่านั้น</p>
    </div>`;
  document.getElementById("modal").classList.add("show");
  document.getElementById("closeModal").onclick=closeJudge; document.getElementById("closeModal").focus();
}
function closeJudge(){ document.getElementById("modal").classList.remove("show"); }

function card(band, rows, sum, overlay, isDemo){
  const el=document.createElement("section");
  el.className="card"+(isDemo?" demo":"")+(sum?"":" empty");
  const label = isDemo ? "DEMO" : band.id;
  const meta = sum ? `${sum.n}/${TOTAL_JUDGES} judges` : "ยังไม่มีคะแนน · awaiting scores";
  el.innerHTML = `
    <button class="head" ${sum?"":"disabled"} aria-expanded="false">
      <div class="num">${label}</div>
      <div><div class="title">${isDemo?esc(band.name):"วง "+band.id+" · "+esc(band.name)}${isDemo?'<span class="tag">ตัวอย่าง</span>':""}</div>
        <div class="meta">${meta}</div></div>
      <div class="score">${sum?`<span class="big">${fmt(sum.overall)}</span><span class="of"> /7</span>`:""}</div>
      <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">${sum?'<path d="M5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>':""}</svg>
    </button>
    <div class="body"></div>`;
  if(!sum) return el;

  const best=Math.max(...sum.avg), worst=Math.min(...sum.avg);
  const tableRows = ASPECTS.map((a,i)=>{
    const v=sum.avg[i], cls = v===best&&best!==worst?"hi":v===worst&&best!==worst?"lo":"";
    const mark = overlay?`<div class="mark" style="left:calc(${overlay[i]/7*100}% - 1px)" title="Program avg ${fmt(overlay[i])}"></div>`:"";
    return `<tr><td class="an">${a.th}<small>${a.en}</small></td>
      <td class="bar"><div class="track"><div class="fill" style="width:${v/7*100}%"></div>${mark}</div></td>
      <td class="val ${cls}">${fmt(v)}<small>${sum.n>1?`${sum.min[i]}–${sum.max[i]}`:""}</small></td></tr>`;
  }).join("");

  const comments = rows.map((r,i)=>({r,i})).filter(x=>String(x.r.comment||"").trim()).map(({r,i})=>`
    <button class="comment" data-i="${i}"><div class="who">${judgeLabel(r,i)}<span class="see">ดูคะแนน →</span></div><p>${esc(r.comment.trim())}</p></button>`).join("")
    || `<p class="meta">ไม่มีคอมเมนต์</p>`;

  el.querySelector(".body").innerHTML = `
    <div class="grid">
      <div class="radar">${radar(sum.avg, overlay)}
        <div class="legend"><span><i></i>วงนี้</span>${overlay?'<span><i class="avg"></i>เฉลี่ยทุกวง</span>':""}</div></div>
      <table>${tableRows}</table>
    </div>
    <h3>คอมเมนต์จากกรรมการ · Comments</h3>
    ${comments}`;

  el.querySelectorAll(".comment").forEach(b=>b.addEventListener("click",()=>openJudge(band,rows,+b.dataset.i,sum,isDemo)));
  const head=el.querySelector(".head");
  head.addEventListener("click",()=>{ const o=el.classList.toggle("open"); head.setAttribute("aria-expanded",o); });
  return el;
}

const list=document.getElementById("list");
if(SHOW_DEMO){
  const ds=summarize(DEMO.responses);
  list.appendChild(card(DEMO.band, DEMO.responses, ds, DEMO.programAvg, true));
}
real.forEach(x=>list.appendChild(card(x.band, x.rows, x.sum, programAvg, false)));

document.getElementById("stats").innerHTML =
  `<span><b>${scored.length}</b>/${BANDS.length} วงมีคะแนน</span><span><b>${RESPONSES.length}</b> ใบประเมิน</span>`+
  (scored.length?`<span>เฉลี่ยรวม <b>${fmt(mean(scored.map(x=>x.sum.overall)))}</b></span>`:"");

const setAll=open=>document.querySelectorAll(".card:not(.empty)").forEach(c=>{c.classList.toggle("open",open);c.querySelector(".head").setAttribute("aria-expanded",open);});
document.getElementById("helpBtn").onclick=openHelp;
document.getElementById("expandAll").onclick=()=>setAll(true);
document.getElementById("collapseAll").onclick=()=>setAll(false);

document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeJudge(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeJudge(); });

/* Open the first card that has data */
const first=document.querySelector(".card:not(.empty)"); if(first){first.classList.add("open");first.querySelector(".head").setAttribute("aria-expanded",true);}
</script>
</body>
</html>
