<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Random Changes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Mono:wght@400;500&family=Noto+Music&display=swap">
<style>
/* Layout: RSU Jazz house style — wordmark header, a lead-sheet chart on white paper (4 bars per line), options panel below */
:root{
  --bg:#f5f2eb; --surface:#ffffff; --accent:#1a4fa0; --accent-dim:#4a7ad4; --accent-light:rgba(26,79,160,0.08);
  --text:#111111; --text-muted:#666666; --text-dim:#999999;
  --border:rgba(26,79,160,0.25); --border-dim:rgba(26,79,160,0.1);
  --on:#3ab86a; --bad:#e05555; --ink:#111111;
  --f-serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-music:"Noto Music","Segoe UI Symbol",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f-mono);font-size:14px;line-height:1.5;
  padding-block:2.5rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:1.5rem}

/* Header */
header{text-align:center}
.wordmark{font-family:var(--f-serif);font-size:13px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:.5rem}
header h1{font-family:var(--f-serif);font-size:clamp(28px,5vw,44px);font-weight:600;letter-spacing:-.01em;line-height:1.1;margin:0;text-wrap:balance}
header h1 span{color:var(--accent)}
.subtitle{font-size:11px;color:var(--text-muted);letter-spacing:.2em;text-transform:uppercase;margin-top:.6rem}
header .rule{width:40px;height:1px;background:var(--border);margin:1.5rem auto 0}

.card{background:var(--surface);border:1px solid var(--border);border-radius:2px;box-shadow:0 2px 12px rgba(0,0,0,0.04)}

/* Chart toolbar */
.sheet{padding:clamp(14px,3.5vw,32px);display:flex;flex-direction:column;gap:clamp(18px,3vw,28px)}
.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chart-title{font-family:var(--f-serif);font-weight:600;font-size:clamp(20px,3.4vw,26px);line-height:1.1;margin:0}
.chart-meta{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);margin-top:4px}
.btn{font-family:var(--f-mono);font-size:13px;letter-spacing:.15em;text-transform:uppercase;padding:12px 22px;border-radius:2px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;transition:background .2s,border-color .2s;white-space:nowrap}
@media (hover:hover){.btn:hover{background:var(--accent-dim);border-color:var(--accent-dim)}}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Chart */
.chart{--row-h:clamp(56px,12vw,86px);--tw:clamp(10px,2.2vw,15px);--gut:calc(var(--tw) + 4px);padding-left:var(--gut);display:flex;flex-direction:column;gap:clamp(20px,3.4vw,28px);padding-top:6px}
.line{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--row-h);animation:rise .28s ease-out both;animation-delay:calc(var(--i) * 35ms)}
.line.sec-end{margin-bottom:clamp(6px,1.4vw,12px)}
.line::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--ink)}
/* section start (bar 1, 9, 17, 25): opening double bar */
.line.sec-start::before{width:4.5px;background:none;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
/* every line's first chord sits where it would after an opening double bar, so all first chords align */
.line .m:first-of-type{padding-left:calc(clamp(6px,1.6vw,14px) + 3px)}
.bn{position:absolute;left:1px;top:-15px;font-size:10px;color:var(--text-dim);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.m{position:relative;display:flex;align-items:center;min-width:0;padding-left:clamp(6px,1.6vw,14px);padding-right:10px}
.m::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1.5px;background:var(--ink)}
.m.dbl::after{width:4.5px;background:none;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
.m.fin::after{width:9px;background:none;border-left:1.5px solid var(--ink);border-right:4.5px solid var(--ink)}
.m.rep{justify-content:center;padding-left:0}
.m.rep svg{width:clamp(24px,5vw,36px);height:auto;color:var(--ink)}

.tsig{position:absolute;top:0;bottom:0;left:calc(-1 * var(--gut));width:var(--tw);color:var(--ink)}
.tsig svg{display:block;width:100%;height:100%}
.ch{display:inline-flex;align-items:baseline;white-space:nowrap;font-family:var(--f-serif);color:var(--ink);font-size:clamp(15px,5.3vw,37px);line-height:1}
.ch .rt{font-weight:600}
@media (max-width:340px){.ch{font-size:15.5px}}
.ch .acc{display:inline-block;font-family:var(--f-music);font-weight:400;font-size:.92em;position:relative;top:-.3em;margin:0 .06em 0 .08em;transform:scaleX(1.3);-webkit-text-stroke:.03em currentColor}
.ch .mn{display:inline-block;width:.55em;height:max(2px,.14em);background:currentColor;vertical-align:.3em;margin-right:.07em;border-radius:.02em}
.ch .q{font-weight:600;font-size:.68em;position:relative;top:-.5em;margin-left:.07em;letter-spacing:.02em}

.empty{border:1px dashed var(--border);border-radius:2px;padding:28px 16px;text-align:center;color:var(--text-muted);font-size:13px;letter-spacing:.05em}

@keyframes rise{from{transform:translateY(3px)}to{transform:none}}

/* Options */
.opts{padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec + .sec{padding-top:20px;border-top:1px solid var(--border-dim)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim)}
.label .count{letter-spacing:.08em;text-transform:none;margin-left:8px;color:var(--text-muted)}
.actions{display:flex;gap:6px}
.link{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:5px 12px;border-radius:2px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;transition:all .18s}
@media (hover:hover){.link:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}}

.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;justify-items:center}
.kchip{width:48px;height:48px;border-radius:50%;padding:0;border:1.5px solid var(--border);background:var(--surface);color:var(--text-dim);font-family:var(--f-serif);font-weight:600;font-size:16px;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center}
.kchip .acc{font-family:var(--f-music);font-weight:400;font-size:.85em;margin-left:.04em}
.kchip[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:#fff;box-shadow:0 2px 10px rgba(58,184,106,0.3)}
@media (hover:hover){.kchip:not([aria-pressed="true"]):hover{border-color:var(--accent);color:var(--accent)}}
@media (max-width:460px){.keys{grid-template-columns:repeat(5,1fr)}.kchip{width:44px;height:44px;font-size:15px}}

.progs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prog{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px;border:1px solid var(--border);border-radius:2px;background:var(--surface);color:var(--text-muted);cursor:pointer;transition:all .2s;text-align:left}
.prog .pl{font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase}
.prog .pp{font-family:var(--f-serif);font-weight:600;font-size:16px;color:var(--text);white-space:nowrap}
.prog .pp i{font-style:normal;font-weight:400;color:var(--text-dim);margin:0 .35em}
.prog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:rgba(255,255,255,.8)}
.prog[aria-pressed="true"] .pp,.prog[aria-pressed="true"] .pp i{color:#fff}
@media (hover:hover){.prog:not([aria-pressed="true"]):hover{border-color:var(--accent);color:var(--accent)}}
@media (max-width:520px){.progs{grid-template-columns:1fr}}

.lines{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-width:420px}
.lbtn{height:42px;border:1px solid var(--border);border-radius:2px;background:var(--surface);color:var(--text-muted);font-family:var(--f-mono);font-size:15px;cursor:pointer;transition:all .18s;font-variant-numeric:tabular-nums;padding:0}
.lbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (hover:hover){.lbtn:not([aria-pressed="true"]):hover{border-color:var(--accent);color:var(--accent)}}
.hint{font-size:11px;color:var(--text-dim);letter-spacing:.05em}

.keyhelp{color:var(--text-dim);font-size:11px;letter-spacing:.08em;text-align:center}
kbd{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border:1px solid var(--border);border-radius:2px;background:var(--surface);color:var(--text-muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="wordmark">Rangsit University · Jazz Program</div>
    <h1>Random <span>Changes</span></h1>
    <div class="subtitle">Chord progression generator</div>
    <div class="rule"></div>
  </header>

  <div class="card sheet">
    <div class="toolbar">
      <div>
        <h2 class="chart-title" id="chartTitle">Study No. 1</h2>
        <div class="chart-meta" id="chartMeta">4/4 · 24 bars</div>
      </div>
      <button class="btn" id="newBtn" type="button">New chart</button>
    </div>
    <div class="chart" id="chart" aria-live="polite"></div>
  </div>

  <div class="card opts">
    <div class="sec">
      <div class="sec-head">
        <span class="label">Keys <span class="count" id="keyCount"></span></span>
        <span class="actions"><button type="button" class="link" id="allKeys">All</button><button type="button" class="link" id="noKeys">None</button></span>
      </div>
      <div class="keys" id="keys" role="group" aria-label="Keys that may appear"></div>
    </div>

    <div class="sec">
      <span class="label">Progressions</span>
      <div class="progs" role="group" aria-label="Progressions that may appear">
        <button type="button" class="prog" id="prog-iiVI" aria-pressed="true"><span class="pl">4 bars</span><span class="pp"><i>|</i>ii−7<i>|</i>V7<i>|</i>Imaj7<i>|</i>%<i>|</i></span></button>
        <button type="button" class="prog" id="prog-iiV" aria-pressed="true"><span class="pl">2 bars, paired</span><span class="pp"><i>|</i>ii−7<i>|</i>V7<i>|</i></span></button>
      </div>
    </div>

    <div class="sec">
      <span class="label">Lines <span class="count">4 bars each</span></span>
      <div class="lines" id="lines" role="group" aria-label="Number of lines"></div>
      <span class="hint">A paired ii–V fills its line with a second ii–V, in the same key or a different one.</span>
    </div>
  </div>

  <p class="keyhelp">Keys: <kbd>Space</kbd> or <kbd>Enter</kbd> new chart</p>
</div>

<script>
(function(){
  const LETTERS=['C','D','E','F','G','A','B'];
  const NAT=[0,2,4,5,7,9,11];             // natural pitch classes, also the major-scale steps
  const ACC={'-1':'♭','0':'','1':'♯'};
  const ACC_WORD={'-1':' flat','0':'','1':' sharp'};
  // cycle of 4ths: C F B♭ E♭ A♭ D♭ G♭ F♯ B E A D G
  const KEYS=[[0,0],[3,0],[6,-1],[2,-1],[5,-1],[1,-1],[4,-1],[3,1],[6,0],[2,0],[5,0],[1,0],[4,0]];
  const QUAL={'-7':'<span class="mn"></span>7','7':'7','maj7':'maj7'};
  const QUAL_WORD={'-7':' minor 7','7':' 7','maj7':' major 7'};
  const REPEAT='<svg viewBox="0 0 40 30" aria-hidden="true"><circle cx="9" cy="8" r="3.4" fill="currentColor"/><line x1="7" y1="27" x2="33" y2="3" stroke="currentColor" stroke-width="4.6" stroke-linecap="round"/><circle cx="31" cy="22" r="3.4" fill="currentColor"/></svg>';

  // 4/4 stretched to the full height of the bar line, kept narrow
  const TSIG='<span class="tsig" aria-label="4/4 time" role="img"><svg viewBox="0 0 10 22" preserveAspectRatio="none" aria-hidden="true">'+
    '<text x="5" y="10.9" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="15.2" fill="currentColor">4</text>'+
    '<text x="5" y="21.9" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="15.2" fill="currentColor">4</text></svg></span>';
  const $=id=>document.getElementById(id);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const pcOf=k=>((NAT[k[0]]+k[1])%12+12)%12;

  // spell scale degree d (0-based) of the major key k
  function degree(k,d){
    const li=(k[0]+d)%7;
    const pc=((NAT[k[0]]+k[1]+NAT[d])%12+12)%12;
    const a=((pc-NAT[li]+18)%12)-6;
    return {li,a};
  }
  const ii=k=>Object.assign(degree(k,1),{q:'-7'});
  const V =k=>Object.assign(degree(k,4),{q:'7'});
  const I =k=>Object.assign(degree(k,0),{q:'maj7'});

  const keySel=new Set([0,1,2,3,4,12]); // preset: C F B♭ E♭ A♭ G
  const progSel=new Set(['iiVI','iiV']);
  let nLines=6, study=0;

  function makeLine(keys){
    const p=pick([...progSel]);
    if(p==='iiVI'){ const k=pick(keys); return [ii(k),V(k),I(k),{rep:true}]; }
    const k1=pick(keys);
    const others=keys.filter(k=>pcOf(k)!==pcOf(k1));
    const k2=(others.length&&Math.random()<.5)?pick(others):k1;
    return [ii(k1),V(k1),ii(k2),V(k2)];
  }

  function generate(){
    const chart=$('chart');
    const keys=[...keySel].sort((a,b)=>a-b).map(i=>KEYS[i]);
    if(!keys.length||!progSel.size){
      const need=[!keys.length&&'one key',!progSel.size&&'one progression'].filter(Boolean).join(' and ');
      chart.innerHTML='<div class="empty">Pick at least '+need+' below to make a chart.</div>';
      $('chartMeta').textContent='4/4 · no chart';
      return;
    }
    const lines=[]; let prev='';
    for(let i=0;i<nLines;i++){
      let ln, sig, tries=0;
      do{ ln=makeLine(keys); sig=JSON.stringify(ln); } while(sig===prev&&++tries<12);
      prev=sig; lines.push(ln);
    }
    study++;
    $('chartTitle').textContent='Study No. '+study;
    $('chartMeta').textContent='4/4 · '+(nLines*4)+' bars';
    render(lines);
  }

  function chordHtml(c){
    return '<span class="ch"><span class="rt">'+LETTERS[c.li]+'</span>'+
      (c.a?'<span class="acc">'+ACC[c.a]+'</span>':'')+
      '<span class="q">'+QUAL[c.q]+'</span></span>';
  }
  const chordWords=c=>LETTERS[c.li]+ACC_WORD[c.a]+QUAL_WORD[c.q];

  function render(lines){
    const chart=$('chart'); chart.innerHTML='';
    const total=lines.length*4;
    lines.forEach((ln,li)=>{
      const row=document.createElement('div');
      row.className='line'; row.style.setProperty('--i',li);
      const first=li*4+1;
      if(first%8===1) row.classList.add('sec-start');
      row.setAttribute('role','group');
      row.setAttribute('aria-label','Bars '+first+' to '+(first+3));
      row.innerHTML='<span class="bn" aria-hidden="true">'+first+'</span>'+(li===0?TSIG:'');
      ln.forEach((c,ci)=>{
        const bar=first+ci;
        const m=document.createElement('div');
        m.className='m'+(c.rep?' rep':'');
        if(bar===total) m.classList.add('fin');
        else if(bar%8===0){ m.classList.add('dbl'); row.classList.add('sec-end'); }
        m.innerHTML=c.rep?REPEAT:chordHtml(c);
        m.setAttribute('aria-label','Bar '+bar+': '+(c.rep?'repeat previous bar':chordWords(c)));
        row.appendChild(m);
      });
      chart.appendChild(row);
    });
  }

  // Keys
  const keyBox=$('keys');
  KEYS.forEach((k,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='kchip'; b.id='key'+i;
    b.innerHTML=LETTERS[k[0]]+(k[1]?'<span class="acc">'+ACC[k[1]]+'</span>':'');
    b.setAttribute('aria-label',LETTERS[k[0]]+ACC_WORD[k[1]]+' major');
    b.addEventListener('click',()=>{ keySel.has(i)?keySel.delete(i):keySel.add(i); syncKeys(); generate(); });
    keyBox.appendChild(b);
  });
  function syncKeys(){
    [...keyBox.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(keySel.has(i))));
    $('keyCount').textContent=keySel.size+' of '+KEYS.length;
  }
  $('allKeys').addEventListener('click',()=>{ KEYS.forEach((_,i)=>keySel.add(i)); syncKeys(); generate(); });
  $('noKeys').addEventListener('click',()=>{ keySel.clear(); syncKeys(); generate(); });

  // Progressions
  ['iiVI','iiV'].forEach(id=>{
    const b=$('prog-'+id);
    b.addEventListener('click',()=>{
      progSel.has(id)?progSel.delete(id):progSel.add(id);
      b.setAttribute('aria-pressed',String(progSel.has(id)));
      generate();
    });
  });

  // Lines 1–8
  const lineBox=$('lines');
  for(let n=1;n<=8;n++){
    const b=document.createElement('button');
    b.type='button'; b.className='lbtn'; b.id='lines'+n; b.textContent=n;
    b.setAttribute('aria-label',n+(n===1?' line':' lines'));
    b.addEventListener('click',()=>{ nLines=n; syncLines(); generate(); });
    lineBox.appendChild(b);
  }
  function syncLines(){ [...lineBox.children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i+1===nLines))); }

  $('newBtn').addEventListener('click',generate);
  document.addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.target.closest&&e.target.closest('button,input,textarea,select')) return;
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); generate(); }
  });

  syncKeys(); syncLines(); generate();
})();
</script>

</body></html>
